<!DOCTYPE html>
<!-- tag::study[] -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="|학습: ${study.title}|">학습</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1><a href="/">Flashcard</a></h1>

<p class="muted">
    <span th:text="|${study.title} · ${study.position} / ${study.total}|">진행</span>
    <span th:if="${study.retryRound}" th:text="|· ${study.round}라운드 (재도전)|">라운드</span>
    <span th:text="|· ${study.direction.label}|">방향</span>
</p>

<div class="card-box">
    <span th:if="${!flipped}" th:text="${question}">질문</span>
    <span th:if="${flipped}" th:text="${answer}">답</span>
</div>

<p th:if="${!flipped}">
    <a class="button primary" th:href="@{/study(flipped=true)}">뒤집기</a>
</p>

<!-- 뒤집은 뒤에만 스스로 판정한다 -->
<form th:if="${flipped}" action="/study/answer" method="post">
    <button type="submit" name="correct" value="true" class="correct">맞았어요</button>
    <button type="submit" name="correct" value="false" class="wrong">틀렸어요</button>
</form>

<form action="/study/finish" method="post">
    <button type="submit">그만하기</button>
</form>
</body>
</html>
<!-- end::study[] -->
