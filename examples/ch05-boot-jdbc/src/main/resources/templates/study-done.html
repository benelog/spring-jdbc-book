<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학습 완료</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1><a href="/">Flashcard</a></h1>

<div class="card-box">
    <span th:text="|${deck.name} 학습을 마쳤습니다! 🎉|">학습 완료</span>
</div>

<p>
    <a class="button" th:href="@{/decks/{id}(id=${deck.id})}">덱으로 돌아가기</a>
    <a class="button primary" th:href="@{/decks/{id}/study(id=${deck.id})}">다시 학습</a>
</p>
</body>
</html>
