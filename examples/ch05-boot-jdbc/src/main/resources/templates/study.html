<!DOCTYPE html>
<!-- tag::study[] -->
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="|학습: ${deck.name}|">학습</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1><a href="/">Flashcard</a></h1>

<p class="muted" th:text="|${deck.name} · ${index + 1} / ${total}|">진행 상황</p>

<div class="card-box">
    <span th:if="${!flipped}" th:text="${card.text}">원문</span>
    <span th:if="${flipped}" th:text="${card.meaning}">뜻</span>
</div>

<p>
    <a class="button" th:href="@{/decks/{id}/study(id=${deck.id}, index=${index}, flipped=${!flipped})}">뒤집기</a>
    <a class="button primary" th:href="@{/decks/{id}/study(id=${deck.id}, index=${index + 1})}">다음 카드</a>
</p>
</body>
</html>
<!-- end::study[] -->
